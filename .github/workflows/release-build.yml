name: Release build

on:
  workflow_dispatch: {}
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ZeightPortraitManager.csproj

      - name: Build (Release)
        run: msbuild ZeightPortraitManager.csproj /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal

      - name: Verify single-exe output
        shell: pwsh
        run: |
          $outDir = "bin\Release"
          Get-ChildItem $outDir | Format-Table Name, Length
          if (-not (Test-Path "$outDir\Portrait Manager.exe")) {
            throw "Portrait Manager.exe not found in $outDir"
          }
          if (Test-Path "$outDir\Portrait Manager.pdb") {
            throw "Release build should not produce a .pdb - DebugType is set to 'none' for this configuration"
          }

      - name: Package artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "dev" }
          Compress-Archive -Path "bin\Release\*" -DestinationPath "PortraitManager-$version.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortraitManager-${{ github.ref_name }}
          path: PortraitManager-*.zip
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PortraitManager-*.zip
          generate_release_notes: true
